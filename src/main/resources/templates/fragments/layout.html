<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:fragment="layout(content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} ?: 'Campus Asset Tracker'">Campus Asset Tracker</title>

    <!-- Bootstrap 5.3 CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}"/>

    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 600; }
        .nav-link.active { font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🎓 Campus Asset Tracker</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/}"
                       th:classappend="${requestURI == '/'} ? ' active' : ''">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/assets}"
                       th:classappend="${#strings.startsWith(requestURI, '/assets')} ? ' active' : ''">
                        <i class="bi bi-laptop"></i> Assets
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/maintenance}"
                       th:classappend="${#strings.startsWith(requestURI, '/maintenance')} ? ' active' : ''">
                        <i class="bi bi-tools"></i> Maintenance
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/recommendations}"
                       th:classappend="${#strings.startsWith(requestURI, '/recommendations')} ? ' active' : ''">
                        <i class="bi bi-exclamation-triangle"></i> Recommendations
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div th:replace="${content}">
        <!-- child page content injected here -->
    </div>
</div>

<!-- Bootstrap 5.3 JS bundle -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
