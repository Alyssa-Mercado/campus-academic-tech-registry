spring.application.name=classroom-asset-tracker
spring.datasource.url=jdbc:h2:mem:assetdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# Replacement age thresholds (years) per asset type
replacement.age-thresholds.CLASSROOM_PC=5
replacement.age-thresholds.PROJECTOR=7
replacement.age-thresholds.SMARTBOARD=8
replacement.age-thresholds.CAMERA=6
replacement.age-thresholds.MICROPHONE=6
