<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/layout :: layout(~{::section})}">
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0"
            th:text="${asset.id == null} ? 'Add Asset' : 'Edit Asset'">Asset</h2>
        <a th:href="@{/assets}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Assets
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/assets/save}" method="post" th:object="${asset}">
                <!-- Hidden id for edits -->
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3">

                    <!-- Name -->
                    <div class="col-md-6">
                        <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                        <input type="text" id="name" class="form-control"
                               th:field="*{name}" required placeholder="e.g. Projector – Room 101"/>
                    </div>

                    <!-- Asset Type -->
                    <div class="col-md-6">
                        <label for="assetType" class="form-label">Asset Type <span class="text-danger">*</span></label>
                        <select id="assetType" class="form-select" th:field="*{assetType}" required>
                            <option value="">— Select type —</option>
                            <option th:each="type : ${assetTypes}"
                                    th:value="${type.name()}"
                                    th:text="${type.displayName}"
                                    th:selected="${asset.assetType == type}">
                            </option>
                        </select>
                    </div>

                    <!-- Serial Number -->
                    <div class="col-md-6">
                        <label for="serialNumber" class="form-label">Serial Number</label>
                        <input type="text" id="serialNumber" class="form-control"
                               th:field="*{serialNumber}" placeholder="e.g. SN-20231015-001"/>
                    </div>

                    <!-- Building -->
                    <div class="col-md-3">
                        <label for="building" class="form-label">Building <span class="text-danger">*</span></label>
                        <input type="text" id="building" class="form-control"
                               th:field="*{building}" required placeholder="e.g. Science Hall"/>
                    </div>

                    <!-- Room Number -->
                    <div class="col-md-3">
                        <label for="roomNumber" class="form-label">Room Number <span class="text-danger">*</span></label>
                        <input type="text" id="roomNumber" class="form-control"
                               th:field="*{roomNumber}" required placeholder="e.g. 204"/>
                    </div>

                    <!-- Purchase Date -->
                    <div class="col-md-4">
                        <label for="purchaseDate" class="form-label">Purchase Date <span class="text-danger">*</span></label>
                        <input type="date" id="purchaseDate" class="form-control"
                               name="purchaseDate" required
                               th:value="${asset.purchaseDate != null ? #temporals.format(asset.purchaseDate, 'yyyy-MM-dd') : ''}"/>
                    </div>

                    <!-- Warranty Expiry Date -->
                    <div class="col-md-4">
                        <label for="warrantyExpiryDate" class="form-label">Warranty Expiry Date <span class="text-danger">*</span></label>
                        <input type="date" id="warrantyExpiryDate" class="form-control"
                               name="warrantyExpiryDate" required
                               th:value="${asset.warrantyExpiryDate != null ? #temporals.format(asset.warrantyExpiryDate, 'yyyy-MM-dd') : ''}"/>
                    </div>

                    <!-- Age Threshold Years (override) -->
                    <div class="col-md-4">
                        <label for="ageThresholdYears" class="form-label">Age Threshold (years)</label>
                        <input type="number" id="ageThresholdYears" class="form-control"
                               th:field="*{ageThresholdYears}"
                               min="1" max="30"
                               placeholder="Leave blank to use default"/>
                        <div class="form-text">Override the default replacement age for this asset.</div>
                    </div>

                    <!-- Notes -->
                    <div class="col-12">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea id="notes" class="form-control" rows="3"
                                  th:field="*{notes}" placeholder="Optional notes…"></textarea>
                    </div>

                </div><!-- /row -->

                <hr class="mt-4"/>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/assets}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy"></i>
                        <span th:text="${asset.id == null} ? 'Add Asset' : 'Save Changes'">Save</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</section>
</body>
</html>
