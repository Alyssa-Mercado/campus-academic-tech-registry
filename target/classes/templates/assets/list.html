<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/layout :: layout(~{::section})}">
<body>
<section>

    <!-- Page header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0">Assets</h2>
        <a th:href="@{/assets/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg"></i> Add Asset
        </a>
    </div>

    <!-- Filter bar -->
    <div class="card mb-4">
        <div class="card-body py-2">
            <form method="get" th:action="@{/assets}" class="row g-2 align-items-end">
                <div class="col-auto">
                    <label for="typeFilter" class="form-label mb-1 small">Filter by Type</label>
                    <select id="typeFilter" name="type" class="form-select form-select-sm"
                            onchange="this.form.submit()">
                        <option value="">All Types</option>
                        <option th:each="t : ${assetTypes}"
                                th:value="${t.name()}"
                                th:text="${t.displayName}"
                                th:selected="${selectedType == t}">
                        </option>
                    </select>
                </div>
                <div class="col-sm-4">
                    <label for="searchInput" class="form-label mb-1 small">Search</label>
                    <div class="input-group input-group-sm">
                        <input id="searchInput" type="text" name="search" class="form-control"
                               placeholder="Name or building…"
                               th:value="${searchTerm}"/>
                        <button class="btn btn-outline-secondary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-auto" th:if="${selectedType != null or searchTerm != null}">
                    <a th:href="@{/assets}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-x-lg"></i> Clear
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Asset table -->
    <div class="card">
        <div class="card-body p-0">
            <div th:if="${assets.isEmpty()}" class="text-center text-muted py-5">
                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                No assets found.
                <a th:href="@{/assets}" class="d-block mt-1 small">Clear filters</a>
            </div>

            <div th:unless="${assets.isEmpty()}">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Building / Room</th>
                        <th>Warranty</th>
                        <th>Purchase Date</th>
                        <th>Age (yrs)</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="asset : ${assets}">
                        <td>
                            <a th:href="@{/assets/{id}(id=${asset.id})}"
                               th:text="${asset.name}" class="fw-semibold text-decoration-none">
                            </a>
                        </td>
                        <td>
                            <span class="badge bg-secondary"
                                  th:text="${asset.assetType.displayName}"></span>
                        </td>
                        <td th:text="${asset.building + ' / ' + asset.roomNumber}"></td>
                        <td>
                            <span th:class="'badge ' + ${asset.warrantyStatus.badgeClass}"
                                  th:text="${asset.warrantyStatus.displayName}"></span>
                        </td>
                        <td th:text="${#temporals.format(asset.purchaseDate, 'dd MMM yyyy')}"></td>
                        <td th:text="${asset.ageYears}"></td>
                        <td class="text-end text-nowrap">
                            <a th:href="@{/assets/{id}(id=${asset.id})}"
                               class="btn btn-sm btn-outline-primary me-1">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/assets/{id}/edit(id=${asset.id})}"
                               class="btn btn-sm btn-outline-secondary me-1">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#deleteModal-' + ${asset.id}">
                                <i class="bi bi-trash"></i> Delete
                            </button>

                            <!-- Delete confirmation modal -->
                            <div class="modal fade"
                                 th:id="'deleteModal-' + ${asset.id}"
                                 tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title">Confirm Delete</h5>
                                            <button type="button" class="btn-close"
                                                    data-bs-dismiss="modal"></button>
                                        </div>
                                        <div class="modal-body text-start">
                                            <p>Are you sure you want to delete
                                                <strong th:text="${asset.name}"></strong>?
                                            </p>
                                            <p class="text-muted small mb-0">
                                                All associated maintenance events will also be removed.
                                            </p>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary"
                                                    data-bs-dismiss="modal">Cancel</button>
                                            <form th:action="@{/assets/{id}/delete(id=${asset.id})}"
                                                  method="post" class="d-inline">
                                                <button type="submit" class="btn btn-danger">
                                                    Delete
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</section>
</body>
</html>
