<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en"
      th:replace="~{fragments/layout :: layout(~{::section})}">
<body>
<section>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0"
            th:text="${event.id == null} ? 'Log Maintenance' : 'Edit Maintenance'">
            Maintenance
        </h2>
        <a th:href="@{/maintenance}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Maintenance
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/maintenance/save}" method="post" th:object="${event}">

                <!-- Hidden id for edits -->
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3">

                    <!-- Asset dropdown -->
                    <div class="col-md-6">
                        <label for="assetId" class="form-label">Asset <span class="text-danger">*</span></label>
                        <select id="assetId" name="assetId" class="form-select" required>
                            <option value="">— Select asset —</option>
                            <option th:each="a : ${assets}"
                                    th:value="${a.id}"
                                    th:text="${a.name + ' — ' + a.building + ' Room ' + a.roomNumber}"
                                    th:selected="${a.id == preselectedAssetId}">
                            </option>
                        </select>
                    </div>

                    <!-- Status -->
                    <div class="col-md-6">
                        <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                        <select id="status" class="form-select" th:field="*{status}" required>
                            <option value="">— Select status —</option>
                            <option th:each="s : ${maintenanceStatuses}"
                                    th:value="${s.name()}"
                                    th:text="${s.displayName}"
                                    th:selected="${event.status == s}">
                            </option>
                        </select>
                    </div>

                    <!-- Scheduled Date -->
                    <div class="col-md-6">
                        <label for="scheduledDate" class="form-label">Scheduled Date <span class="text-danger">*</span></label>
                        <input type="date" id="scheduledDate" class="form-control"
                               name="scheduledDate" required
                               th:value="${event.scheduledDate != null ? #temporals.format(event.scheduledDate, 'yyyy-MM-dd') : ''}"/>
                    </div>

                    <!-- Completed Date -->
                    <div class="col-md-6">
                        <label for="completedDate" class="form-label">Completed Date</label>
                        <input type="date" id="completedDate" class="form-control"
                               name="completedDate"
                               th:value="${event.completedDate != null ? #temporals.format(event.completedDate, 'yyyy-MM-dd') : ''}"/>
                        <div class="form-text">Leave blank if not yet completed.</div>
                    </div>

                    <!-- Description -->
                    <div class="col-12">
                        <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                        <textarea id="description" class="form-control" rows="3"
                                  th:field="*{description}" required
                                  placeholder="Describe the maintenance work…"></textarea>
                    </div>

                </div><!-- /row -->

                <hr class="mt-4"/>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/maintenance}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-floppy"></i>
                        <span th:text="${event.id == null} ? 'Log Event' : 'Save Changes'">Save</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

</section>
</body>
</html>
