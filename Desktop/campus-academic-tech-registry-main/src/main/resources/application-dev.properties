# ============================================================
# Development profile — PostgreSQL
# ============================================================
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or set environment variable: SPRING_PROFILES_ACTIVE=dev
#
# Prerequisites:
#   1. PostgreSQL running locally (default port 5432)
#   2. Create database: CREATE DATABASE assetdb;
#   3. Set the environment variables below (or replace inline for local dev)
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/assetdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'validate' or 'none' in production; 'update' is convenient for dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console is not used with PostgreSQL
spring.h2.console.enabled=false

# Replacement age thresholds (years) per asset type — same as default profile
replacement.age-thresholds.CLASSROOM_PC=5
replacement.age-thresholds.PROJECTOR=7
replacement.age-thresholds.SMARTBOARD=8
replacement.age-thresholds.CAMERA=6
replacement.age-thresholds.MICROPHONE=6
